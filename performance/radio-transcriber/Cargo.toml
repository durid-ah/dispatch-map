[package]
name = "radio-transcriber"
version = "0.1.0"
edition = "2021"
description = "Ingests local dispatch radio audio files and prepares 16kHz PCM chunks via FFmpeg"
publish = false

[dependencies]
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
